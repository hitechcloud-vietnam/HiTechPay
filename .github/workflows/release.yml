name: Release

# Publishes a GitHub Release with the notes of the matching CHANGELOG.md section and
# ready-to-use artifacts. Two ways to release:
#   * push a tag `vX.Y.Z`, or
#   * run this workflow manually on `main` with input `tag: vX.Y.Z` — the tag is then created
#     on the commit the workflow runs on (useful when tags cannot be pushed directly).
# Container images: images.yml builds them for pushed `v*` tags; for manual releases this
# workflow dispatches images.yml with `version: vX.Y.Z`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  actions: write

env:
  GIT_AUTHOR_NAME: hitechpay-ci
  GIT_AUTHOR_EMAIL: ci@hitechpay.vn
  GIT_COMMITTER_NAME: hitechpay-ci
  GIT_COMMITTER_EMAIL: ci@hitechpay.vn

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # pushed tag → that tag; manual run → the commit the workflow was started on
          ref: ${{ github.event_name == 'push' && steps.tag.outputs.tag || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Release notes from CHANGELOG.md
        run: |
          version="${{ steps.tag.outputs.tag }}"
          version="${version#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Không tìm thấy mục [$version] trong CHANGELOG.md" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Fetch and patch the WooCommerce plugin
        run: |
          git submodule update --init --depth 1 upstream/hyperswitch-woocommerce-plugin
          scripts/apply-patches.sh hyperswitch-woocommerce-plugin

      - name: Build artifacts
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          mkdir -p dist

          # HiTechPay patch series + helper scripts (apply on top of the pinned upstream commits)
          tar czf "dist/hitechpay-patches-${tag}.tar.gz" patches scripts tools branding

          # Deployment bundle (docker compose, nginx, helm values, docs)
          tar czf "dist/hitechpay-deploy-${tag}.tar.gz" deploy docs README.md plan.md

          # Node SDK (npm package tarball)
          (cd sdks/node && npm install --no-audit --no-fund && npm test && npm run build && npm pack --pack-destination ../../dist)

          # PHP SDK
          (cd sdks/php && zip -qr "../../dist/hitechpay-php-${tag}.zip" . -x 'vendor/*' 'tests/*')

          # WHMCS gateway module (copy modules/ into the WHMCS root)
          (cd plugins/whmcs && zip -qr "../../dist/hitechpay-whmcs-${tag}.zip" modules)

          # WooCommerce plugin (upload via WordPress → Plugins → Add New → Upload)
          git -C upstream/hyperswitch-woocommerce-plugin archive --format=zip \
            --prefix=hitechpay-woocommerce/ -o "$PWD/dist/hitechpay-woocommerce-${tag}.zip" HEAD

          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: HiTechPay ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ startsWith(steps.tag.outputs.tag, 'v0.') }}
          files: dist/*

      # Tags created with GITHUB_TOKEN do not trigger other workflows, so build the release
      # images explicitly for manual releases.
      - name: Build release images
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run images.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f version="${{ steps.tag.outputs.tag }}"
