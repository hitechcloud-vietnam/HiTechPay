name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `git am` (scripts/apply-patches.sh) needs an identity; runners have none configured.
env:
  GIT_AUTHOR_NAME: hitechpay-ci
  GIT_AUTHOR_EMAIL: ci@hitechpay.vn
  GIT_COMMITTER_NAME: hitechpay-ci
  GIT_COMMITTER_EMAIL: ci@hitechpay.vn

jobs:
  patches:
    name: Patches apply on pinned upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch patched submodules
        run: |
          for repo in hyperswitch hyperswitch-web hyperswitch-control-center \
            hyperswitch-client-core hyperswitch-woocommerce-plugin; do
            git submodule update --init --depth 1 "upstream/$repo"
          done
      - name: Apply patches
        run: scripts/apply-patches.sh
      - name: Scripts are idempotent
        run: |
          python3 tools/register_connectors.py upstream/hyperswitch
          python3 tools/register_control_center.py upstream/hyperswitch-control-center
          python3 tools/whitelabel.py
          # status (not diff) so files the tools would add are caught too
          for repo in hyperswitch hyperswitch-control-center hyperswitch-web; do
            changes="$(git -C "upstream/$repo" status --porcelain)"
            if [ -n "$changes" ]; then
              echo "::error::tools changed upstream/$repo after the patches were applied:"
              echo "$changes"
              git -C "upstream/$repo" diff --stat
              exit 1
            fi
          done

  connectors:
    name: VN connector unit tests
    runs-on: ubuntu-latest
    needs: patches
    steps:
      - uses: actions/checkout@v4
      # only upstream/hyperswitch is initialised here, so patch just that repo
      # (without an argument apply-patches.sh stops at the uninitialised web/dashboard repos)
      - name: Fetch and patch upstream/hyperswitch
        run: |
          git submodule update --init --depth 1 upstream/hyperswitch
          scripts/apply-patches.sh hyperswitch
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/hyperswitch
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev
      - name: Unit tests
        working-directory: upstream/hyperswitch
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: >
          cargo test -p hyperswitch_connectors --features "v1 payouts frm" --lib --
          vn_utils momo vnpay zalopay payos sepay pay2s viettelmoney

  sdk-node:
    name: Node SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test

  sdk-php:
    name: PHP SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, json
      - run: php tests/run.php
