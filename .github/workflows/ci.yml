name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patches:
    name: Patches apply on pinned upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch patched submodules
        run: |
          for repo in hyperswitch hyperswitch-web hyperswitch-control-center; do
            git submodule update --init --depth 1 "upstream/$repo"
          done
      - name: Apply patches
        run: scripts/apply-patches.sh
      - name: Scripts are idempotent
        run: |
          python3 tools/register_connectors.py upstream/hyperswitch
          python3 tools/register_control_center.py upstream/hyperswitch-control-center
          python3 tools/whitelabel.py
          git -C upstream/hyperswitch diff --exit-code
          git -C upstream/hyperswitch-control-center diff --exit-code
          git -C upstream/hyperswitch-web diff --exit-code

  connectors:
    name: VN connector unit tests
    runs-on: ubuntu-latest
    needs: patches
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 upstream/hyperswitch && scripts/apply-patches.sh
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@hitechpay.vn
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/hyperswitch
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev
      - name: Unit tests
        working-directory: upstream/hyperswitch
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: >
          cargo test -p hyperswitch_connectors --features "v1 payouts frm" --lib --
          vn_utils momo vnpay zalopay payos sepay pay2s viettelmoney

  sdk-node:
    name: Node SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test

  sdk-php:
    name: PHP SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, json
      - run: php tests/run.php
