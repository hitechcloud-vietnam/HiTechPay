# HiTechPay single-host gateway. Put TLS termination in front (or add certificates here).
# Hostnames: api.*, dashboard.*, checkout.* — adjust server_name to your domains.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name api.hitechpay.vn api.localhost;
  client_max_body_size 10m;

  location / {
    proxy_pass http://router:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

server {
  listen 80;
  server_name checkout.hitechpay.vn checkout.localhost;

  location / {
    proxy_pass http://checkout-sdk:9050;
    proxy_set_header Host $host;
  }
}

server {
  listen 80 default_server;
  server_name dashboard.hitechpay.vn dashboard.localhost;

  location /branding/ {
    alias /usr/share/nginx/branding/;
    expires 7d;
  }

  location /api/ {
    proxy_pass http://router:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://dashboard:9000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }
}
